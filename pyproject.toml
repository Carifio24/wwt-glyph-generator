[project]
name = "wwt-glyph-generator"

description = "A tool for generating glyph images and associated XML for WorldWide Telescope"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fonttools",
    "lxml",
    "Wand"
]
dynamic = [ "version",]

[build-system]
requires = ["setuptools",
            "setuptools_scm",
            "wheel"]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
"wwt_glyph_generator" = ["**/*.ttf"]
